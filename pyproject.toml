[project]
name = "orcid-etl"
version = "0.1.0"
description = "KNAW/IISG staff ORCID profiles -> NDE Schema.org AP compliant RDF"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyshacl>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orcid_etl*"]
